<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initializing...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #overlay {
      position: fixed; inset: 0; background: #000;
      pointer-events: none; z-index: 10;
      transition: opacity 0.9s ease-out;
    }
    #whiteout {
      position: fixed; inset: 0; background: #fff;
      pointer-events: none; z-index: 11; opacity: 0;
      transition: opacity 0.65s ease-in;
    }
    #skip {
      position: fixed; bottom: 24px; right: 24px; z-index: 20;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.38);
      padding: 8px 18px; font-family: 'Courier New', monospace;
      font-size: 11px; letter-spacing: 0.14em; cursor: pointer;
      border-radius: 3px; transition: all 0.25s; text-transform: uppercase;
    }
    #skip:hover {
      background: rgba(255,255,255,0.13); color: rgba(255,255,255,0.75);
      border-color: rgba(100,220,255,0.4);
    }
  </style>
</head>
<body>
<div id="overlay"></div>
<div id="whiteout"></div>
<button id="skip">Skip</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';

// CONFIG -- change JENKINS_URL to wherever the dashboard lives
const JENKINS_URL    = window.location.origin + '/dashboard.html';
const INTRO_DURATION = 4.2;
const FADE_DURATION  = 0.65;

// Redirect logic
let redirectFired = false;
function triggerRedirect() {
  if (redirectFired) return;
  redirectFired = true;
  const wo = document.getElementById('whiteout');
  wo.style.opacity = '1';
  wo.style.pointerEvents = 'all';
  setTimeout(() => window.location.replace(JENKINS_URL), FADE_DURATION * 1000 + 80);
}
document.getElementById('skip').addEventListener('click', triggerRedirect);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.z = 55;
const clock = new THREE.Clock();

// ============================================================
// 1. BACKGROUND -- inverted sphere with rainbow star field
// ============================================================
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: { uTime: { value: 0.0 } },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vDir;

    float hash(float n) { return fract(sin(n) * 43758.5453); }
    float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

    vec3 hsl2rgb(float h, float s, float l) {
      float c = (1.0 - abs(2.0*l - 1.0)) * s;
      float x = c * (1.0 - abs(mod(h*6.0, 2.0) - 1.0));
      float m = l - c*0.5;
      vec3 rgb;
      if      (h < 0.1667) rgb = vec3(c,x,0);
      else if (h < 0.3333) rgb = vec3(x,c,0);
      else if (h < 0.5000) rgb = vec3(0,c,x);
      else if (h < 0.6667) rgb = vec3(0,x,c);
      else if (h < 0.8333) rgb = vec3(x,0,c);
      else                 rgb = vec3(c,0,x);
      return rgb + m;
    }

    // Returns (starBrightness, starHue) for a given direction + density layer
    vec2 starLayer(vec3 dir, float density) {
      vec2 uv = vec2(atan(dir.x, dir.z), asin(clamp(dir.y,-0.9999,0.9999)));
      uv *= density / 3.14159265;
      vec2 cell = floor(uv);
      vec2 f    = fract(uv);

      float h   = hash2(cell);
      float h2  = hash2(cell + vec2(3.1, 7.4));
      float h3  = hash2(cell + vec2(1.7, 2.9));

      // Star position within cell
      vec2 sp = vec2(hash2(cell + 0.1), hash2(cell + 0.2));
      float d = length(f - sp);

      // Twinkle: slow and gentle
      float tw = 0.7 + 0.3 * sin(uTime * (0.8 + h * 2.5) + h * 6.283);

      // Size: most stars tiny, a few larger
      float size = mix(0.04, 0.12, h * h);
      float bright = smoothstep(size, 0.0, d) * tw;

      // Hue: biased toward blue-white but full rainbow scattered in
      // h2 < 0.6 -> near-white/blue stars (more common)
      // h2 >= 0.6 -> colorful stars (less common)
      float hue = mix(
        0.55 + h3 * 0.15,  // blue-cyan range (most stars)
        h3,                // full rainbow (some stars)
        step(0.6, h2)
      );

      return vec2(bright, hue);
    }

    void main() {
      vec3 dir = normalize(vDir);

      // Deep space -- very dark, subtle blue-indigo gradient
      float y = abs(dir.y);
      vec3 spaceCol = mix(
        vec3(0.0, 0.004, 0.018),
        vec3(0.0, 0.0,   0.006),
        y
      );

      // Four density layers for depth
      vec2 s1 = starLayer(dir,  65.0);
      vec2 s2 = starLayer(dir, 160.0);
      vec2 s3 = starLayer(dir, 320.0);
      vec2 s4 = starLayer(dir, 600.0);

      // Weighted brightness (fainter than before)
      float b1 = s1.x * 0.55;
      float b2 = s2.x * 0.38;
      float b3 = s3.x * 0.26;
      float b4 = s4.x * 0.16;

      // Near-white core for brighter stars; tinted for dimmer ones
      vec3 white = vec3(0.92, 0.96, 1.0);
      vec3 c1 = mix(hsl2rgb(s1.y, 0.85, 0.65), white, 0.4);
      vec3 c2 = mix(hsl2rgb(s2.y, 0.80, 0.60), white, 0.3);
      vec3 c3 = mix(hsl2rgb(s3.y, 0.75, 0.55), white, 0.2);
      vec3 c4 = mix(hsl2rgb(s4.y, 0.70, 0.50), white, 0.1);

      vec3 starCol = c1*b1 + c2*b2 + c3*b3 + c4*b4;

      gl_FragColor = vec4(spaceCol + starCol, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(280, 32, 32), skyMat));

// ============================================================
// 2. CENTRAL TORUS KNOT -- holographic iridescent
// ============================================================
const torusMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0.0 } },
  vertexShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vec3 pos = position;
      float d = sin(pos.x*4.0 + uTime)
              * sin(pos.y*3.0 + uTime*0.71)
              * sin(pos.z*5.0 + uTime*1.33)
              * 0.19;
      pos += normal * d;
      vNormal   = normalize(normalMatrix * normal);
      vWorldPos = (modelMatrix * vec4(pos,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying vec2 vUv;

    vec3 hsl2rgb(float h, float s, float l) {
      float c = (1.0 - abs(2.0*l - 1.0)) * s;
      float x = c * (1.0 - abs(mod(h*6.0, 2.0) - 1.0));
      float m = l - c*0.5;
      vec3 rgb;
      if      (h < 0.1667) rgb = vec3(c,x,0);
      else if (h < 0.3333) rgb = vec3(x,c,0);
      else if (h < 0.5000) rgb = vec3(0,c,x);
      else if (h < 0.6667) rgb = vec3(0,x,c);
      else if (h < 0.8333) rgb = vec3(x,0,c);
      else                 rgb = vec3(c,0,x);
      return rgb + m;
    }

    void main() {
      vec3 viewDir = normalize(cameraPosition - vWorldPos);
      float fresnel = dot(viewDir, vNormal);
      float hue  = fract(fresnel*2.1 + uTime*0.085 + vUv.x*0.35);
      vec3 iri   = hsl2rgb(hue, 1.0, 0.52);
      float rim  = pow(1.0 - abs(fresnel), 3.8);
      vec3 rimC  = vec3(0.25, 0.85, 1.0) * rim * 2.2;
      float scan = smoothstep(0.62, 1.0, sin(vUv.y*90.0 + uTime*2.5)*0.5+0.5) * 0.14;
      gl_FragColor = vec4(vec3(0.02,0.04,0.09) + iri*0.82 + rimC + vec3(0.15,0.9,1.0)*scan, 1.0);
    }
  `
});
const torusKnot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.65, 0.58, 200, 26, 2, 3),
  torusMat
);
scene.add(torusKnot);

// ============================================================
// 3. PARTICLES -- 60k, galaxy spiral, custom shader
// ============================================================
const PC = 60000;
const pPos   = new Float32Array(PC * 3);
const pSz    = new Float32Array(PC);
const pPh    = new Float32Array(PC);
const pCol   = new Float32Array(PC * 3);
{
  const c = new THREE.Color();
  for (let i = 0; i < PC; i++) {
    const i3 = i * 3;
    const arm = Math.floor(Math.random() * 3);
    const t   = Math.pow(Math.random(), 0.55) * 30.0;
    const ang = t * 0.34 + arm * (Math.PI * 2 / 3);
    const spr = (0.5 + t * 0.07) * (Math.random() - 0.5);
    if (Math.random() < 0.72) {
      pPos[i3]     = Math.cos(ang)*t + spr*Math.cos(ang+Math.PI*0.5);
      pPos[i3+1]   = (Math.random()-0.5)*(0.9+t*0.04);
      pPos[i3+2]   = Math.sin(ang)*t + spr*Math.sin(ang+Math.PI*0.5);
    } else {
      const r = 3.0+Math.random()*24.0, th=Math.random()*Math.PI*2, ph=Math.acos(2.0*Math.random()-1.0);
      pPos[i3]=r*Math.sin(ph)*Math.cos(th); pPos[i3+1]=r*Math.cos(ph)*0.28; pPos[i3+2]=r*Math.sin(ph)*Math.sin(th);
    }
    pSz[i] = 0.5 + Math.random()*2.6;
    pPh[i] = Math.random()*Math.PI*2;
    const dist = Math.sqrt(pPos[i3]**2+pPos[i3+2]**2);
    c.setHSL(0.54+(Math.random()-0.5)*0.16, 0.88-dist*0.015, 0.65+Math.random()*0.32);
    pCol[i3]=c.r; pCol[i3+1]=c.g; pCol[i3+2]=c.b;
  }
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('aSize',    new THREE.BufferAttribute(pSz,  1));
pGeo.setAttribute('aPhase',   new THREE.BufferAttribute(pPh,  1));
pGeo.setAttribute('aColor',   new THREE.BufferAttribute(pCol, 3));

const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0.0 } },
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: `
    uniform float uTime;
    attribute float aSize;
    attribute float aPhase;
    attribute vec3  aColor;
    varying vec3  vColor;
    varying float vAlpha;
    void main() {
      vec3 pos = position;
      // Drift in world space
      pos.y += sin(uTime*0.28 + aPhase) * 0.42;
      pos.x += cos(uTime*0.19 + aPhase*1.37) * 0.22;
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      float sz = aSize * (360.0 / -mvPos.z);
      gl_PointSize = clamp(sz, 0.4, 8.5);
      gl_Position  = projectionMatrix * mvPos;
      float df = clamp((-mvPos.z - 1.5) / 24.0, 0.0, 1.0);
      vAlpha = df * (0.48 + 0.52*sin(uTime*0.75+aPhase));
      vColor = aColor;
    }
  `,
  fragmentShader: `
    varying vec3  vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float a = (1.0 - smoothstep(0.25, 1.0, d)) * vAlpha;
      if (a < 0.004) discard;
      float glo = exp(-d*3.8)*0.55;
      gl_FragColor = vec4(vColor + glo, a);
    }
  `
});
const pSystem = new THREE.Points(pGeo, pMat);
pSystem.rotation.x = 0.16;
scene.add(pSystem);

// ============================================================
// 4. DATA NODES -- 14 icosahedra, solid + wireframe
// ============================================================
const NC = 14;
const nodes     = [];
const nodeOrbit = [];
const nColors = [0x00ffcc,0x0088ff,0x44ffff,0xff44aa,0x8844ff,0x00ff88,0x4488ff,
                 0xff8800,0x00ccff,0xff00cc,0x44ff44,0xff4444,0x8800ff,0x00eeff];
for (let i = 0; i < NC; i++) {
  const r=0.14+Math.random()*0.46, oR=3.8+Math.random()*5.8;
  const sp=0.16+Math.random()*0.38, ph=Math.random()*Math.PI*2, ti=(Math.random()-0.5)*0.9;
  const col = nColors[i];
  const geo = new THREE.IcosahedronGeometry(r, 1);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.55 })));
  const wm = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:0.88 }));
  wm.scale.setScalar(1.06);
  g.add(wm);
  scene.add(g);
  nodes.push(g);
  nodeOrbit.push({ oR, sp, ph, ti });
}

// ============================================================
// 5. ENERGY BEAMS
// ============================================================
function nPos(i, t) {
  const { oR, sp, ph, ti } = nodeOrbit[i];
  const a = t*sp+ph;
  return new THREE.Vector3(
    Math.cos(a)*oR + Math.sin(a*0.47)*oR*0.25,
    Math.sin(t*sp*0.6+ph+ti)*oR*0.3,
    Math.sin(a)*oR
  );
}
const bPairs = [];
for (let a=0; a<NC; a++) for (let b=a+1; b<NC; b++)
  if (nPos(a,0).distanceTo(nPos(b,0)) < 9.0) bPairs.push([a,b]);

const bPos = new Float32Array(bPairs.length*6);
const bIdx = new Float32Array(bPairs.length*2);
for (let i=0; i<bPairs.length*2; i++) bIdx[i]=Math.floor(i/2);

const bGeo = new THREE.BufferGeometry();
bGeo.setAttribute('position',   new THREE.BufferAttribute(bPos,3).setUsage(THREE.DynamicDrawUsage));
bGeo.setAttribute('aBeamIndex', new THREE.BufferAttribute(bIdx,1));
const bMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value:0.0 } },
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  vertexShader: `
    attribute float aBeamIndex;
    varying float vIdx;
    void main() { vIdx=aBeamIndex; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform float uTime;
    varying float vIdx;
    void main() {
      float pulse = sin(uTime*2.2 + vIdx*1.88)*0.5+0.5;
      gl_FragColor = vec4(0.08, 0.76, 1.0, pulse*0.52);
    }
  `
});
scene.add(new THREE.LineSegments(bGeo, bMat));

// ============================================================
// POST-PROCESSING -- all inline, no external shader imports
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// Bloom
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5, 0.4, 0.0
);
composer.addPass(bloomPass);

// Chromatic aberration (inline)
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value:null }, uAmount: { value:0.004 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uAmount; varying vec2 vUv;
    void main(){
      vec2 d=vUv-0.5; float l=length(d);
      float r=texture2D(tDiffuse,vUv-d*uAmount*l).r;
      float g=texture2D(tDiffuse,vUv).g;
      float b=texture2D(tDiffuse,vUv+d*uAmount*l).b;
      gl_FragColor=vec4(r,g,b,1.0);
    }
  `
}));

// Film grain (inline)
const grainPass = new ShaderPass({
  uniforms: { tDiffuse:{value:null}, uTime:{value:0.0}, uIntensity:{value:0.03} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uIntensity; varying vec2 vUv;
    float rand(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453+uTime); }
    void main(){
      vec4 col=texture2D(tDiffuse,vUv);
      col.rgb += (rand(vUv)*2.0-1.0)*uIntensity;
      gl_FragColor=col;
    }
  `
});
composer.addPass(grainPass);

// Vignette (inline)
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse:{value:null}, uOffset:{value:0.95}, uDarkness:{value:1.45} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uOffset; uniform float uDarkness; varying vec2 vUv;
    void main(){
      vec4 col=texture2D(tDiffuse,vUv);
      float d=length(vUv-0.5)*uOffset;
      col.rgb *= clamp(1.0 - uDarkness*d*d, 0.0, 1.0);
      gl_FragColor=col;
    }
  `
}));

// Fade in
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getElementById('overlay').style.opacity = '0';
}));

// Resize
window.addEventListener('resize', () => {
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  composer.setSize(w,h);
  bloomPass.resolution.set(w,h);
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  const delta   = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Camera pull-in ease-out cubic over 3.5s: z 55->12
  const cp   = Math.min(elapsed / 3.5, 1.0);
  const ease = 1.0 - Math.pow(1.0 - cp, 3.0);
  camera.position.z = THREE.MathUtils.lerp(55.0, 12.0, ease);

  skyMat.uniforms.uTime.value    = elapsed;
  torusMat.uniforms.uTime.value  = elapsed;
  pMat.uniforms.uTime.value      = elapsed;
  bMat.uniforms.uTime.value      = elapsed;
  grainPass.uniforms.uTime.value = elapsed;

  torusKnot.rotation.x += delta * 0.17;
  torusKnot.rotation.y += delta * 0.27;
  torusKnot.rotation.z += delta * 0.06;
  pSystem.rotation.y   += delta * 0.017;

  for (let i=0; i<NC; i++) {
    const { oR, sp, ph, ti } = nodeOrbit[i];
    const a = elapsed*sp+ph;
    nodes[i].position.set(
      Math.cos(a)*oR + Math.sin(a*0.47)*oR*0.25,
      Math.sin(elapsed*sp*0.6+ph+ti)*oR*0.3,
      Math.sin(a)*oR
    );
    nodes[i].rotation.x += delta*sp*0.68;
    nodes[i].rotation.y += delta*sp*1.05;
  }

  const ba = bGeo.attributes.position;
  for (let i=0; i<bPairs.length; i++) {
    const [a,b]=bPairs[i];
    const pa=nodes[a].position, pb=nodes[b].position;
    const vi=i*6;
    ba.array[vi]=pa.x;   ba.array[vi+1]=pa.y; ba.array[vi+2]=pa.z;
    ba.array[vi+3]=pb.x; ba.array[vi+4]=pb.y; ba.array[vi+5]=pb.z;
  }
  ba.needsUpdate = true;

  if (!redirectFired && elapsed >= INTRO_DURATION) triggerRedirect();

  composer.render();
}
animate();
</script>
</body>
</html>
